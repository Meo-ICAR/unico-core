[program:unico-unicoagent-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/twillio/artisan queue:work --queue=default --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/twillio/storage/logs/queue-worker.log
stopwaitsecs=3600
